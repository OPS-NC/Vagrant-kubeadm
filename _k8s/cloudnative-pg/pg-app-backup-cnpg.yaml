# pg-app-backup-cnpg.yaml — backup NATIF CloudNativePG (via CRD) du cluster `pg-demo`
# (qui contient la base `app`), poussé dans MinIO en S3.
#
# ≠ du backup pg_dump-via-Vault (pg-backup-vault-s3.yaml) : ici c'est du PHYSIQUE géré par
# l'opérateur (base backup + archivage WAL continu → PITR), sur TOUTE l'instance (donc `app`
# incluse), avec les identifiants INTERNES de CNPG (pas ceux de Vault).
#
# Prérequis : `spec.backup.barmanObjectStore` configuré sur le Cluster `pg-demo` (fait par
# pg-app-backup-cnpg-up.sh ; snippet ci-dessous à titre de doc) + bucket MinIO `cnpg-backups`
# + Secret `cnpg-backup-s3` (access/secret key). CNPG opérateur ≤ 1.30 (in-tree barman).
#
# --- Snippet appliqué au Cluster (pour référence) ---------------------------
#   spec:
#     backup:
#       retentionPolicy: "7d"
#       barmanObjectStore:
#         destinationPath: s3://cnpg-backups/
#         endpointURL: http://minio.minio-cluster.svc.cluster.local:9000
#         s3Credentials:
#           accessKeyId:     { name: cnpg-backup-s3, key: ACCESS_KEY_ID }
#           secretAccessKey: { name: cnpg-backup-s3, key: SECRET_ACCESS_KEY }
#         wal:  { compression: gzip }
#         data: { compression: gzip }
# ----------------------------------------------------------------------------
---
# Backup RÉCURRENT : toutes les heures (cron CNPG à 6 champs, la 1re = les secondes).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-demo-hourly
  namespace: cnpg-demo
spec:
  schedule: "0 0 * * * *"        # sec=0 min=0 => au top de chaque heure
  backupOwnerReference: self
  cluster:
    name: pg-demo
---
# Backup À LA DEMANDE (exemple) : `kubectl apply` de cet objet déclenche un backup immédiat.
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: pg-demo-backup-now
  namespace: cnpg-demo
spec:
  cluster:
    name: pg-demo
