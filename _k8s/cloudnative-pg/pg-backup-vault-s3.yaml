# pg-backup-vault-s3.yaml — backup logique HORAIRE de la base `vault`, poussé dans MinIO (S3).
#
# Particularité : la connexion à PostgreSQL utilise les identifiants GÉRÉS PAR VAULT
# (secret `pg-rotate-creds`, mot de passe rotaté par le static role `vault-rotate` — cf.
# ../vault-secret-operator/). Le dump est chiffré côté transport (sslmode=require) puis
# envoyé dans le bucket `pg-backups` avec un utilisateur MinIO DÉDIÉ (scopé au bucket).
#
# Namespace : pg-rotate-demo (là où VSO écrit `pg-rotate-creds`). Le Secret MinIO
# `minio-backup-creds` (endpoint + access/secret key) est créé par pg-backup-up.sh.
#
# Prérequis : CloudNativePG `pg-demo` UP + rotation Vault en place + addon minio-s3/cluster.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup-vault-s3
  namespace: pg-rotate-demo
  labels: { app: pg-backup-vault-s3 }
spec:
  schedule: "0 * * * *"          # toutes les heures, à la minute 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app: pg-backup-vault-s3 }
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              # pg_dump 18 (aligné serveur PG 18) ; mc récupéré en binaire statique au run.
              image: postgres:18-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp        # uid 1000 sans passwd : mc/écritures config -> /tmp
                  # 1) client MinIO (mc) — binaire statique, pas de paquet à installer
                  wget -qO /tmp/mc https://dl.min.io/client/mc/release/linux-amd64/mc
                  chmod +x /tmp/mc
                  # 2) dump de la base `vault` avec les creds Vault (DATABASE_URL du secret)
                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  file="/tmp/vault-${ts}.sql.gz"
                  echo "[backup] pg_dump base=${PGDATABASE} user=${PGUSER} (creds Vault) -> ${file}"
                  pg_dump "$DATABASE_URL" | gzip -9 > "$file"
                  echo "[backup] taille : $(ls -lh "$file" | awk '{print $5}')"
                  # 3) upload dans le bucket MinIO avec l'utilisateur dédié
                  /tmp/mc alias set s3 "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null
                  /tmp/mc cp "$file" "s3/pg-backups/"
                  echo "[backup] contenu du bucket :"
                  /tmp/mc ls s3/pg-backups/
              envFrom:
                - secretRef: { name: pg-rotate-creds }     # DATABASE_URL + PGDATABASE/PGUSER/...
                - secretRef: { name: minio-backup-creds }  # MINIO_ENDPOINT/ACCESS/SECRET
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
