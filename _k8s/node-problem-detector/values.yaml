# values.yaml — node-problem-detector (chart deliveryhero) adapté à ce lab kubeadm/Debian 13.
#
# NPD est un DaemonSet qui surveille la SANTÉ DES NODES et remonte les problèmes en
# NodeConditions + Events (KernelDeadlock, ReadonlyFilesystem, OOM, TaskHung, KernelOops,
# erreurs FS/IO...). Utile ici : c'est exactement le genre de panne qui a figé cp2.
#
# Adaptation : on ne garde QUE le kernel-monitor (lecture de /dev/kmsg).
#   - docker-monitor (chargé par défaut par le chart) parle au socket Docker : le runtime de
#     ce lab est containerd (kubeadm), il n'y a pas de Docker → le moniteur échoue.
#   - systemd-monitor lit journald. systemd existe bien sur Debian 13, mais Debian laisse le
#     journal en VOLATILE (/run/log/journal) tant que /var/log/journal n'est pas créé, alors
#     que le chart ne monte que /var/log → le moniteur ne verrait rien. Pour l'activer :
#     créer /var/log/journal sur les nodes (`vagrant ssh`, mkdir + systemctl restart
#     systemd-journald) PUIS ajouter /config/systemd-monitor.json ci-dessous.
settings:
  log_monitors:
    - /config/kernel-monitor.json      # kmsg -> détecte OOM / TaskHung / KernelOops / Ext4/IO errors
  custom_monitors: []

# NPD tourne en privileged (accès /dev/kmsg). Le namespace est étiqueté PodSecurity
# `privileged` par node-problem-detector-up.sh : kubeadm n'applique aucun niveau au niveau
# cluster par défaut, mais l'étiquette documente l'intention et protège si on durcit.
securityContext:
  privileged: true

# Tolère tous les taints NoSchedule => tourne AUSSI sur les control-plane (surveille cp1/2/3).
tolerations:
  - effect: NoSchedule
    operator: Exists

# Métriques Prometheus exposées (port 20257). ServiceMonitor OFF tant que l'addon
# observability n'a pas ses CRD Prometheus-Operator ; à passer à true ensuite.
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
