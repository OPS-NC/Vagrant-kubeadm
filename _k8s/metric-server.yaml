# metric-server.yaml — metrics-server v0.9.0 (API `metrics.k8s.io` => `kubectl top`,
# et la source des métriques d'un HorizontalPodAutoscaler).
#
# Basé sur le manifeste `components.yaml` amont :
#   https://github.com/kubernetes-sigs/metrics-server/releases
# Un seul écart assumé par rapport à l'amont : `--kubelet-insecure-tls` et l'ordre des
# `--kubelet-preferred-address-types` — les deux sont justifiés en commentaire sur les
# arguments eux-mêmes (cf. le Deployment plus bas).
#
# Appliqué par `_k8s/platform-up.sh` (étape [3/4]) ; relançable seul :
#   kubectl apply -f _k8s/metric-server.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: system:aggregated-metrics-reader
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
rules:
- apiGroups:
  - ""
  resources:
  - nodes/metrics
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      containers:
      - args:
        - --cert-dir=/tmp
        - --secure-port=10250
        # ⚠️ kubeadm : le certificat « serving » du kubelet est AUTO-SIGNÉ par le
        # kubelet lui-même (il n'est PAS signé par la CA du cluster) => sans ce
        # drapeau, metrics-server échoue sur `x509: certificate signed by unknown
        # authority` et `kubectl top` renvoie « metrics not available ».
        # Alternative propre, HORS PÉRIMÈTRE de ce lab : `serverTLSBootstrap: true`
        # dans la KubeletConfiguration (le kubelet demande alors un certificat au
        # signataire `kubernetes.io/kubelet-serving`) + un approbateur qui valide les
        # CSR — kube-controller-manager ne les approuve JAMAIS automatiquement, il
        # faudrait donc soit un `kubectl certificate approve` après chaque join, soit
        # un contrôleur tiers. Pour un lab jetable, --kubelet-insecure-tls suffit :
        # le trafic reste chiffré, seule l'identité du kubelet n'est pas vérifiée, et
        # tout vit sur un réseau host-only isolé.
        - --kubelet-insecure-tls
        # L'ORDRE COMPTE : `InternalIP` d'abord. Les nodes sont enregistrés avec leur IP
        # host-only (`node-ip` posé par kubeadm/templates/kubeadm-init.yaml.tpl), qui est
        # toujours joignable. Le `Hostname` d'une VM Vagrant, lui, ne résout que si
        # /etc/hosts a été rempli sur CHAQUE node — un pari qu'on ne prend pas.
        # `ExternalIP` en dernier : aucun node n'en a ici.
        - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: metrics-server
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-dir
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      volumes:
      - emptyDir: {}
        name: tmp-dir
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
