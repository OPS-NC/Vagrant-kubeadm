# Expose l'UI Longhorn via la Gateway API, en HTTPS, sous `longhorn.kubeadm.lab.example.io`.
# Domaine NEUTRE (dépôt public) : ce fichier s'applique À LA MAIN, donc édite le hostname ou
# passe par `sed 's/kubeadm\.lab\.example\.io/<ton-domaine>/g' … | kubectl apply -f -`.
# Cert = wildcard `*.kubeadm.lab.example.io` déjà porté par l'écouteur `https` de main-gateway
# (cert-manager) — aucun nouveau Certificate nécessaire.
#
# ⚠️ L'UI Longhorn n'a AUCUNE authentification native. Derrière ce Gateway elle est
# accessible à quiconque atteint le VIP (via Tailscale). Pour la protéger, ajouter une
# SecurityPolicy Envoy Gateway (Basic Auth / OIDC) — cf. README.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https           # écouteur TLS :443
  hostnames:
    - longhorn.kubeadm.lab.example.io     # matche le wildcard *.kubeadm.lab.example.io
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
