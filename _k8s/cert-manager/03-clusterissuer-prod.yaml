# Émetteur ACME Let's Encrypt PRODUCTION (DNS-01 Cloudflare).
# Certs publiquement trustés. Ne basculer ici qu'APRÈS avoir validé en staging
# (quotas prod limités : ~5 certs identiques / semaine).
# `email`, `dnsZones` et le domaine sont NEUTRES (dépôt public) : platform-up.sh les
# substitue depuis lab.env (LAB_ACME_EMAIL, LAB_DNS_ZONE, LAB_DOMAIN).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - example.io
