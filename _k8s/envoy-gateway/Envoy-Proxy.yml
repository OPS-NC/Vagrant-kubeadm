# envoyproxy-l2.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: cilium-l2
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # Plan de DONNÉES (les pods envoy qui portent réellement le trafic), à ne pas confondre
      # avec le contrôleur `envoy-gateway` posé par le chart.
      #
      # 2 réplicas et pas 1 : ce Deployment est le point de passage unique de TOUTES les UI du
      # lab (une seule IP LoadBalancer, .200). À 1 réplica, la mort de ce pod — reschedule,
      # reboot de node, ou _k8s/chaos-kube/ qui tire au sort toutes les heures — coupe
      # l'intégralité des UI le temps du redémarrage. À 2, le Service garde un endpoint prêt.
      #
      # Le coût est négligeable (un envoy au repos ~50 Mio), et les deux pods se partagent la
      # même IP : rien à changer côté DNS ni côté HTTPRoute.
      envoyDeployment:
        replicas: 2
      envoyService:
        type: LoadBalancer
        loadBalancerClass: io.cilium/l2-announcer
        externalTrafficPolicy: Cluster
---
# gatewayclass.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: cilium-l2
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: envoy-gateway-system      # Gateway + cert wildcard hors du ns default
  annotations:
    # ⚠️ Ce bloc `annotations:` entier n'existe QUE sur le chemin ACME. Le défaut du lab est
    # SELF_SIGNED=true : platform-up.sh RETIRE alors ces lignes, et remplit lui-même le Secret
    # ci-dessous avec un wildcard signé openssl (cf. _k8s/self-signed/). Laisser l'annotation
    # ferait reprendre la main à cert-manager sur ce Secret dès qu'il serait installé.
    #
    # Avec SELF_SIGNED=false, cert-manager émet et renouvelle le wildcard tout seul (DNS-01
    # Cloudflare) : le Certificate + le Secret wildcard-kubeadm-lab-example-io-tls sont créés
    # dans CE namespace.
    #
    # Défaut STAGING volontaire : Let's Encrypt production plafonne à 5 certificats par
    # semaine et par jeu d'identifiants, or le wildcard ne vit que dans etcd — chaque
    # `vagrant destroy` en brûle donc un. Au 6e rebuild d'une même semaine, plus de TLS
    # pendant des heures. platform-up.sh remplace cette valeur par `letsencrypt-prod`
    # quand LAB_ACME_ISSUER=prod (cf. lab.env.example).
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      # Domaine NEUTRE (dépôt public) : platform-up.sh le remplace par LAB_DOMAIN (lab.env),
      # et le nom du Secret TLS ci-dessous suit (wildcard-<domaine-en-tirets>-tls).
      hostname: "*.kubeadm.lab.example.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            # Rempli par cert-manager (SELF_SIGNED=false) OU par selfsigned-up.sh
            # (SELF_SIGNED=true, le défaut) : même nom de Secret dans les deux cas.
            name: wildcard-kubeadm-lab-example-io-tls
      allowedRoutes:
        namespaces:
          from: All

