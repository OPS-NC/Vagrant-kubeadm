# minio-s3.yaml — MinIO (stockage objet compatible S3) en standalone sur le lab kubeadm.
#
# Image = FORK PIGSTY (pgsty/minio) — PAS le chart Bitnami (images gratuites figées sur
# `bitnamilegacy`), et PAS l'upstream minio/minio (dépôt ARCHIVÉ « no longer maintained » en
# fév. 2026, console amputée depuis mi-2025). Pigsty rebuild le serveur MinIO ET restaure la
# CONSOLE D'ADMIN complète → on a À LA FOIS le récent ET l'admin UI.
# Stockage : 1 PVC local-path (node-local, sans Longhorn). Exposé en HTTPS via main-gateway :
#   - API S3   : https://minio.kubeadm.lab.example.io          (port 9000)
#   - Console  : https://minio-console.kubeadm.lab.example.io  (port 9001, admin complète)
#
# Alternatives (README) : upstream épinglé RELEASE.2025-04-22 (dernière console admin officielle),
# autres forks console (huncrys, georgmangold), ou l'édition payante AIStor.
#
# Le Secret `minio-creds` (root user/password) est créé par minio-up.sh (hors de ce manifeste,
# pour ne pas committer d'identifiants).
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: minio-s3
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio-s3
  labels: { app: minio }
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO local-path : pas deux pods sur le même volume
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-06-18T00-00-00Z   # fork Pigsty : récent + console admin
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-password } }
            # Redirection de la console derrière le reverse-proxy (hostname distinct de l'API).
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://minio-console.kubeadm.lab.example.io
          ports:
            - { name: api,     containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio-s3
  labels: { app: minio }
spec:
  type: ClusterIP
  selector: { app: minio }
  ports:
    - { name: api,     port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
---
# API S3 -> port 9000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-api
  namespace: minio-s3
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - minio.kubeadm.lab.example.io
  rules:
    - backendRefs:
        - name: minio
          port: 9000
---
# Console (navigateur d'objets) -> port 9001
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: minio-s3
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - minio-console.kubeadm.lab.example.io
  rules:
    - backendRefs:
        - name: minio
          port: 9001
