# kube-prometheus-stack-values.yaml — pile métriques du lab kubeadm.
#
# Fournit : Prometheus (+ opérateur & CRDs ServiceMonitor/PodMonitor), Grafana,
# Alertmanager, node-exporter, kube-state-metrics. C'est la base de tout module « ops »
# (PromQL, dashboards, alerting).
#
# Choix « lab » :
#   - stockage sur `longhorn-r1` (1 réplica bloc, StorageClass posée par l'addon
#     longhorn/) → PVC légers, pas de saturation du disque partagé avec l'OS.
#   - rétention courte (2 j) + resources bornées (CP/workers modestes).
#   - controller-manager et scheduler SCRUTÉS (voir plus bas) : contrairement au lab Talos,
#     kubeadm/templates/kubeadm-init.yaml.tpl leur pose `bind-address: 0.0.0.0`.

grafana:
  # Mot de passe admin par défaut du chart : admin / prom-operator (à changer, cf. README).
  persistence:
    enabled: true
    storageClassName: longhorn-r1
    size: 1Gi
  grafana.ini:
    server:
      # Grafana est exposé à la racine d'un hôte dédié (pas de sous-chemin).
      domain: grafana.kubeadm.lab.example.io
      root_url: https://grafana.kubeadm.lab.example.io
  # Ajoute Loki comme source de logs (l'addon Loki tourne dans le même namespace).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    retention: 2d
    externalUrl: https://prometheus.kubeadm.lab.example.io
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-r1
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 3Gi
    # Scrape TOUS les ServiceMonitor/PodMonitor du cluster (pas seulement ceux portant
    # le label de CE release). Indispensable pour récupérer trivy-operator, CloudNativePG, etc.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.kubeadm.lab.example.io
    # Pas de PVC : stockage emptyDir (défaut) — l'historique d'alertes n'a pas besoin de survivre dans un lab.

# --- Composants du control plane -------------------------------------------------------
# Sur le lab Talos, ces quatre moniteurs étaient TOUS désactivés : les composants
# n'écoutaient qu'en loopback et donnaient des cibles « down » sans explication.
# Ici, deux d'entre eux redeviennent scrutables — les deux autres, non. On active donc au
# cas par cas plutôt qu'en bloc, pour ne jamais livrer une cible morte.
#
# controller-manager et scheduler tournent en pods STATIQUES sur les control planes. Le chart
# crée pour eux un Service headless dans `kube-system` dont le sélecteur est
# `component: kube-controller-manager` / `component: kube-scheduler` — exactement les labels
# que kubeadm pose sur ses manifestes statiques : rien d'autre à faire.
kubeControllerManager:
  enabled: true
  service:
    enabled: true
    port: 10257
    targetPort: 10257
  serviceMonitor:
    https: true
    # Le certificat servi sur :10257 est signé par la CA du cluster mais ne porte PAS le nom
    # DNS du Service : la vérification échouerait (`x509: certificate is valid for ...`).
    # Acceptable ici, le scrape reste chiffré et reste sur le réseau host-only.
    insecureSkipVerify: true

kubeScheduler:
  enabled: true
  service:
    enabled: true
    port: 10259
    targetPort: 10259
  serviceMonitor:
    https: true
    insecureSkipVerify: true

# etcd : ACTIVÉ, mais seulement parce que le lab l'a rendu possible AU BOOTSTRAP.
#
# Par défaut, kubeadm génère le pod statique etcd avec
# `--listen-metrics-urls=http://127.0.0.1:2381` : l'endpoint n'existe qu'en LOOPBACK,
# où il ne sert que la sonde de liveness du pod. Prometheus scrute depuis un pod et
# ne peut pas atteindre le loopback du node — la cible resterait DOWN sans explication.
#
# `kubeadm/templates/kubeadm-init.yaml.tpl` passe donc `etcd.local.extraArgs`
# `listen-metrics-urls: http://0.0.0.0:2381`. Si tu montes un cluster autrement que
# par `kubeadm/cluster-up.sh`, repasse `enabled: false` — sinon tu auras une cible morte.
#
# Port 2381 et `scheme: http` : c'est l'endpoint de métriques EN CLAIR, à ne pas
# confondre avec 2379 (l'API client d'etcd, en TLS mutuel, qui exigerait de monter
# les certificats etcd dans Prometheus).
# ⚠️ 2381 ne demande AUCUNE authentification : il n'est acceptable ouvert que parce
#    que le lab vit sur un réseau host-only isolé.
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http

# kube-proxy : DÉSACTIVÉ parce qu'il N'EXISTE PAS. `KUBE_PROXY_REPLACEMENT=true` (défaut de
# lab.env) fait tourner `kubeadm init --skip-phases=addon/kube-proxy` et Cilium prend les
# Services en eBPF. Les métriques équivalentes viennent de Cilium (cf. _k8s/cilium/).
# Même avec `KUBE_PROXY_REPLACEMENT=false`, kube-proxy n'expose ses métriques qu'en
# 127.0.0.1:10249 tant que `metricsBindAddress` n'est pas ouvert.
kubeProxy:
  enabled: false
