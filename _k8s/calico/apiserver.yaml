# apiserver.yaml — la CR `APIServer` de l'opérateur Tigera : elle déclenche le déploiement
# du `calico-apiserver`, qui expose le groupe `projectcalico.org/v3`. C'est ce qui permet de
# lire et écrire les objets Calico (`IPPool`, `NetworkPolicy`/`GlobalNetworkPolicy`, tiers…)
# directement au `kubectl`, sans installer `calicoctl`.
#
# POURQUOI CE FICHIER EXISTE — le même problème d'amorçage que installation.yaml, en pire :
#
# Le chart `tigera-operator` rend cette CR lui-même quand `apiServer.enabled=true` (son
# défaut, cf. templates/crs/custom-resources.yaml). Mais le chart ne livre AUCUN dossier
# `crds/` : c'est l'opérateur qui crée les CRD `operator.tigera.io` à son démarrage
# (`-manage-crds=true`). Sur un cluster neuf, Helm essaie donc de poser un objet `APIServer`
# alors que la CRD `apiservers.operator.tigera.io` n'existe pas encore, et l'installation
# échoue net, AVANT même de créer le namespace :
#
#   Error: unable to build kubernetes objects from release manifest: resource mapping not
#   found for name: "default" ... no matches for kind "APIServer" in version
#   "operator.tigera.io/v1" — ensure CRDs are installed first
#
# C'est exactement la raison pour laquelle le script coupe déjà `installation`, `goldmane` et
# `whisker` : les quatre CR du chart sont dans le même cas. `apiServer` était resté à `true`,
# ce qui rendait l'installation impossible sur un cluster fraîchement bootstrapé.
#
# La CR est donc sortie du chart (`--set apiServer.enabled=false`) et appliquée par
# calico-up.sh APRÈS l'attente des CRD — même mécanique et même propriétaire unique
# (kubectl, pas Helm) que installation.yaml.
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
