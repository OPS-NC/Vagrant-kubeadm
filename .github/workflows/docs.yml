# Publishes the lab documentation to GitHub Pages.
#
# The page is built by docs/build.py (markdown-it-py + Pygments, dependencies declared in
# PEP 723 → installed by uv). A SINGLE self-contained HTML page, bilingual EN/FR (English
# by default) with a light/dark theme: no CDN, no external asset.
#
# The artifact is NOT versioned: it is regenerated on every push to main, which avoids a
# diff of several hundred kilobytes for every documentation change.
#
# ---------------------------------------------------------------------------
# PUBLISHING: ENABLED.
#   Public repo, Pages with "GitHub Actions" as the source, repository variable
#   PUBLISH_PAGES=true. URL: https://ops-nc.github.io/Vagrant-kubeadm/
#
# The `deploy` job stays conditioned on PUBLISH_PAGES. That is deliberate: Pages is
# refused on a private repo outside a paid plan, and without that guard the job would fail
# on every push if the repo went private again — turning the Actions tab into a wall of red
# crosses, until nobody looks at CI any more. To suspend publishing without touching the
# workflow:  gh variable set PUBLISH_PAGES --body false
#
# The `build` job, however, ALWAYS runs: it builds the docs, requires every link and every
# anchor to resolve (--strict), and refuses to publish if it detects a secret pattern.
# ---------------------------------------------------------------------------
name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/build.py
      - .github/workflows/docs.yml
  workflow_dispatch: {}

# Minimal rights: read the code, write Pages, and the OIDC that deploy-pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling the running one (Pages dislikes that).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv no longer publishes a floating major tag beyond v7:
      # we pin the exact version (a `@v9` does not exist and fails the job).
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # build.py queries git (ls-files, check-ignore, log -1): the checkout is enough.
      #
      # `--strict`: a dead link or anchor FAILS the job. Without it, only
      # `make validate-docs` (local) checked the links, and a PR that does not run
      # `make validate` published a holed documentation with nothing reporting it.
      - name: Generate the page (links and anchors checked)
        run: uv run docs/build.py --strict --out _site/index.html

      # Safety rail: no secret may end up in the published page. The repo is public and the
      # docs quote a lot of commands — a real value pasted by accident into a README would
      # be published as-is.
      - name: Check for the absence of secrets
        run: |
          if grep -qE 'hvs\.[A-Za-z0-9]{15,}|cfat_[A-Za-z0-9]{15,}|-----BEGIN [A-Z ]*PRIVATE KEY' _site/index.html; then
            echo "::error::A secret pattern was detected in the generated page." && exit 1
          fi
          echo "✅ no secret pattern detected"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Without this guard, the job fails on every push as long as Pages cannot be enabled
    # (private repo on a Free plan). See the file header to enable it.
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
