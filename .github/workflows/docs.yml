# Publie la documentation du lab sur GitHub Pages.
#
# La page est construite par docs/build.py (markdown-it-py + Pygments, dépendances
# déclarées en PEP 723 → installées par uv). Une SEULE page HTML autonome, bilingue
# EN/FR (anglais par défaut) avec thème clair/sombre : aucun CDN, aucun asset externe.
#
# L'artefact n'est PAS versionné : il est régénéré à chaque push sur main, ce qui évite
# un diff de plusieurs centaines de kilo-octets à chaque changement de doc.
#
# ---------------------------------------------------------------------------
# PUBLICATION : ACTIVE.
#   Dépôt public, Pages en source « GitHub Actions », variable de dépôt
#   PUBLISH_PAGES=true. URL : https://ops-nc.github.io/Vagrant-kubeadm/
#
# Le job `deploy` reste conditionné à PUBLISH_PAGES. C'est délibéré : Pages est refusé
# sur un dépôt privé hors plan payant, et sans cette garde le job échouerait à chaque
# push si le dépôt repassait en privé — transformant l'onglet Actions en mur de croix
# rouges, jusqu'à ce que plus personne ne regarde la CI. Pour suspendre la publication
# sans toucher au workflow :  gh variable set PUBLISH_PAGES --body false
#
# Le job `build`, lui, tourne TOUJOURS : il construit la doc, exige que chaque lien et
# chaque ancre résolve (--strict), et refuse de publier s'il détecte un motif de secret.
# ---------------------------------------------------------------------------
name: docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - docs/build.py
      - .github/workflows/docs.yml
  workflow_dispatch: {}

# Droits minimaux : lecture du code, écriture Pages, et l'OIDC exigé par deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours (Pages n'aime pas).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # astral-sh/setup-uv ne publie plus de tag majeur flottant au-delà de v7 :
      # on épingle la version exacte (un `@v9` n'existe pas et fait échouer le job).
      - name: Installer uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # build.py interroge git (ls-files, check-ignore, log -1) : le checkout suffit.
      #
      # `--strict` : un lien ou une ancre morte fait ÉCHOUER le job. Sans lui, seul
      # `make validate-docs` (local) vérifiait les liens, et une PR qui ne lance pas
      # `make validate` publiait une doc trouée sans que rien ne le signale.
      - name: Générer la page (liens et ancres vérifiés)
        run: uv run docs/build.py --strict --out _site/index.html

      # Garde-fou : aucun secret ne doit se retrouver dans la page publiée. Le dépôt
      # est public et la doc cite beaucoup de commandes — une valeur réelle collée par
      # inadvertance dans un README serait publiée telle quelle.
      - name: Vérifier l'absence de secrets
        run: |
          if grep -qE 'hvs\.[A-Za-z0-9]{15,}|cfat_[A-Za-z0-9]{15,}|-----BEGIN [A-Z ]*PRIVATE KEY' _site/index.html; then
            echo "::error::Un motif de secret a été détecté dans la page générée." && exit 1
          fi
          echo "✅ aucun motif de secret détecté"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Sans cette garde, le job échoue à chaque push tant que Pages n'est pas activable
    # (dépôt privé sur un plan Free). Cf. l'en-tête du fichier pour l'activer.
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
