# Repository validation on every PR — WITHOUT ever bringing a cluster up.
#
# The jobs call the same `make` targets as the ones documented for local use
# (`make validate`): a test's definition lives in the Makefile, never duplicated here.
# A test that passes in CI and fails on the workstation (or the other way round) is a
# broken test.
#
# What is NOT here, and why:
#   - `make validate-docs`: already covered by the `docs` workflow.
name: ci

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

# Read-only: nothing here publishes anything.
permissions:
  contents: read

# A PR pushed three times in a row does not need three validations: we cancel the stale
# runs of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `bash -n` on every git-tracked *.sh (see Makefile). Nothing to install:
      # bash is there, and the list comes from `git ls-files`, so the checkout is enough.
      - name: make validate-shell
        run: make validate-shell

      # lab.env is the single source, but its values are duplicated as a safety net in the
      # Vagrantfile and in cluster-up.sh. Two diverging defaults give an incoherent lab,
      # and nothing would report it before the `vagrant up`.
      - name: make validate-defaults
        run: make validate-defaults

      # `_k8s/` is a public submodule (k8s-playground). This test guarantees that a
      # `git clone --recurse-submodules` will work for a third party: https URL (and not
      # SSH, unusable without a key) and a pinned commit that really is pushed. Both
      # errors are invisible from the machine of whoever commits them.
      - name: make validate-submodule
        run: make validate-submodule

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pinning as the `docs` workflow: setup-uv publishes no floating major tag
      # beyond v7, a `@v9` does not exist and would fail the job.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # uv provides PyYAML on the fly (see YAML_PY in the Makefile): nothing to install
      # system-wide, and the very same command runs locally.
      - name: make validate-yaml
        run: make validate-yaml

  kubeadm:
    name: kubeadm templates (v1beta4 schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # This is THE most valuable job: it installs the real kubeadm binary and has it
      # validate the templates. Without it, a v1beta4 schema mistake (the `extraArgs`
      # dictionary → list trap) is only discovered at `kubeadm init` time, that is, after
      # ten minutes of `vagrant up`.
      - name: Install kubeadm
        run: |
          K8S_APT_MINOR="$(sed -n 's/^K8S_APT_MINOR=//p' lab.env.example | head -n1)"
          K8S_VERSION="$(sed -n 's/^K8S_VERSION=//p' lab.env.example | head -n1)"
          echo "Repo ${K8S_APT_MINOR}, version ${K8S_VERSION}"
          sudo mkdir -p -m 755 /etc/apt/keyrings
          # `--batch --yes`: without a tty, gpg tries to open /dev/tty to ask for
          # overwrite confirmation and dies on "cannot open '/dev/tty'".
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/${K8S_APT_MINOR}/deb/Release.key" \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] \
          https://pkgs.k8s.io/core:/stable:/${K8S_APT_MINOR}/deb/ /" \
            | sudo tee /etc/apt/sources.list.d/kubernetes.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "kubeadm=${K8S_VERSION}-*"
          kubeadm version

      - name: make validate-kubeadm
        run: make validate-kubeadm

  vagrant:
    name: Vagrantfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vagrant is no longer shipped in the runners' ubuntu-24.04 images: we install it
      # from the HashiCorp APT repository, and only when missing (in case a future image
      # puts it back).
      - name: Install Vagrant
        run: |
          if command -v vagrant >/dev/null 2>&1; then
            echo "Vagrant already present: $(vagrant --version)"
            exit 0
          fi
          wget -qO- https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
          https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq vagrant
          vagrant --version

      # --ignore-provider: the runner has no VirtualBox, and without that flag the
      # validation fails on the provider before even reading the Vagrantfile. Locally the
      # flag is omitted, which ALSO validates the provider config.
      - name: make validate-vagrant
        run: make validate-vagrant VAGRANT_VALIDATE_FLAGS=--ignore-provider
        env:
          # No telemetry and no version check from a throwaway runner.
          VAGRANT_NO_COLOR: "1"
          CHECKPOINT_DISABLE: "1"

      # Topology guard rail: the Vagrantfile must refuse an EVEN number of control planes
      # (etcd holds no useful quorum there). A test that checks an error DOES happen beats
      # a comment claiming it does.
      #
      # ⚠️ The grep matches the WORDING of the Vagrantfile's error message ("is EVEN"). If
      #    that message is reworded, this pattern has to follow — otherwise the guard rail
      #    is still there but the test silently stops proving anything.
      - name: The Vagrantfile refuses an even CONTROL_PLANES
        run: |
          if CONTROL_PLANES=2 vagrant validate --ignore-provider 2>&1 | grep -q 'is EVEN'; then
            echo "✅ etcd guard rail: CONTROL_PLANES=2 correctly refused"
          else
            echo "::error::the Vagrantfile accepted CONTROL_PLANES=2" && exit 1
          fi
        env:
          VAGRANT_NO_COLOR: "1"
          CHECKPOINT_DISABLE: "1"
